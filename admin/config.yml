backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "updates"
    label: "NexaBridge Updates"
    files:
      - label: "Posts"
        name: "posts"
        file: "posts/posts.json"
        format: "json"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Date"
                name: "date"
                widget: "datetime"
                time_format: false

              - label: "Short Description"
                name: "excerpt"
                widget: "text"

              - label: "Image"
                name: "image"
                widget: "image"
                required: false

              - label: "LinkedIn URL"
                name: "linkedin_url"
                widget: "string"
                required: false

              - label: "Full Text"
                name: "body"
                widget: "markdown"
                required: false
